[platformio]
default_envs = esp32-s3-devkitc-1-n8r8
data_dir = data
; The Xtensa linker bundled with Arduino-ESP32 2.x cannot create its map file
; below a Windows path containing non-ASCII characters. Keep disposable build
; artifacts in an ASCII-only user cache while leaving sources in this repo.
build_dir = ${platformio.core_dir}/build/notefall88

[env:esp32-s3-devkitc-1-n8r8]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -D CORE_DEBUG_LEVEL=1
  -D BOARD_HAS_PSRAM
lib_deps =
  links2004/WebSockets@2.7.2
  bblanchon/ArduinoJson@7.4.3
