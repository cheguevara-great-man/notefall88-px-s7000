name: release-bundle

on:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate generated engineering package
        run: |
          pip install --only-binary=:all: -r requirements-dev.txt
          pip check
          python scripts/verify_release_tag.py "$GITHUB_REF_NAME"
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
          python scripts/generate.py --check
          python -m pytest
      - name: Build embedded web app
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          npm run coverage
          npm run build
          npx playwright-cli install-browser chromium --with-deps
          npm run smoke:browser
          npx playwright-cli install-browser webkit --with-deps
          NOTEFALL_BROWSER=webkit npm run smoke:browser
      - name: Generate locked dependency SBOM
        run: |
          mkdir -p dist
          npm --prefix web sbom \
            --package-lock-only \
            --sbom-format cyclonedx \
            --sbom-type application \
            > dist/notefall-web-sbom.cdx.json
      - name: Build firmware and LittleFS
        run: |
          pip install platformio==6.1.19
          platformio run -d firmware
          platformio run -d firmware -t buildfs
      - name: Package checksummed update bundle
        run: |
          mkdir -p dist release-work
          cp ~/.platformio/build/notefall88/esp32-s3-devkitc-1-n8r8/firmware.bin release-work/firmware.bin
          cp ~/.platformio/build/notefall88/esp32-s3-devkitc-1-n8r8/littlefs.bin release-work/littlefs.bin
          python scripts/package_update.py \
            --firmware release-work/firmware.bin \
            --filesystem release-work/littlefs.bin \
            --output dist/notefall88-update-${GITHUB_REF_NAME}.zip \
            > dist/manifest.json
          python scripts/package_manufacturing.py \
            --output dist/notefall88-manufacturing-${GITHUB_REF_NAME}.zip \
            > dist/manufacturing-manifest.json
          python scripts/package_factory.py \
            --bootloader ~/.platformio/build/notefall88/esp32-s3-devkitc-1-n8r8/bootloader.bin \
            --partitions ~/.platformio/build/notefall88/esp32-s3-devkitc-1-n8r8/partitions.bin \
            --boot-app ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            --firmware release-work/firmware.bin \
            --filesystem release-work/littlefs.bin \
            --output dist/notefall88-factory-${GITHUB_REF_NAME}.zip \
            > dist/factory-manifest.json
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
              | sort -z \
              | xargs -0 sha256sum \
              > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Attest release provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: notefall88-${{ github.ref_name }}
          path: dist/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=("$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file "docs/releases/${GITHUB_REF_NAME}.md" --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
