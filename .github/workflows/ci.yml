name: engineering-ci

on:
  push:
  pull_request:

jobs:
  mapping-and-cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/generate.py --check
      - run: python -m pytest
      - run: python scripts/package_manufacturing.py --output dist/notefall88-manufacturing-ci.zip
      - uses: actions/upload-artifact@v6
        with:
          name: notefall88-manufacturing
          path: dist/notefall88-manufacturing-ci.zip

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run coverage
      - run: npm run build
      - run: npx playwright-cli install-browser chromium
      - run: npm run smoke:browser
      - run: npx playwright-cli install-browser webkit
      - run: NOTEFALL_BROWSER=webkit npm run smoke:browser
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: notefall88-browser-smoke
          path: output/playwright/smoke-*
          if-no-files-found: ignore
          include-hidden-files: true

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install platformio==6.1.19
      - run: platformio run -d firmware
      - run: platformio run -d firmware -t buildfs
      - name: Verify LittleFS image contents
        run: |
          ~/.platformio/packages/tool-mklittlefs/mklittlefs \
            -b 4096 -p 256 -s 3014656 -l \
            ~/.platformio/build/notefall88/esp32-s3-devkitc-1-n8r8/littlefs.bin \
            | tee /tmp/notefall-littlefs.txt
          grep -q '/index.html' /tmp/notefall-littlefs.txt
          grep -q '/assets/.*\.js\.gz' /tmp/notefall-littlefs.txt
          grep -q '/assets/.*\.css\.gz' /tmp/notefall-littlefs.txt
