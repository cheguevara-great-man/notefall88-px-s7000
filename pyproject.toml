[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notefall88"
version = "0.1.0"
description = "Host tools and parametric validation fixture for the NoteFall 88 piano light guide"
requires-python = ">=3.11"
dependencies = [
  "mido>=1.3,<2",
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
cad = ["cadquery>=2.6,<2.7", "matplotlib>=3.9,<4"]
test = ["pytest>=8,<9"]
live-midi = ["python-rtmidi>=1.5,<2"]
firmware = ["platformio==6.1.18"]

[project.scripts]
notefall = "host.notefall:main"

[tool.setuptools]
packages = ["host"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
